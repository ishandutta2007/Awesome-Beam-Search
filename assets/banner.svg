<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#070a1e" />
      <stop offset="100%" stop-color="#030511" />
    </linearGradient>

    <!-- Node/Path Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b19ffb" />
      <stop offset="100%" stop-color="#f76b1c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS animations for dynamic aspect */
    @keyframes pulse {
      0% { r: 8px; opacity: 0.6; }
      50% { r: 14px; opacity: 1; filter: url(#glow); }
      100% { r: 8px; opacity: 0.6; }
    }
    @keyframes pulse-large {
      0% { r: 14px; opacity: 0.7; }
      50% { r: 22px; opacity: 1; filter: url(#glow); }
      100% { r: 14px; opacity: 0.7; }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes title-glow {
      0%, 100% { fill: #ffffff; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }
      50% { fill: #00f2fe; text-shadow: 0 0 25px rgba(0, 242, 254, 0.9); }
    }
    .node-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
    .node-pulse-delayed {
      animation: pulse 4s infinite ease-in-out;
      animation-delay: 1.5s;
    }
    .node-root {
      animation: pulse-large 5s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8, 12;
      animation: dash 2s linear infinite;
    }
    .title-text {
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: 2px;
      animation: title-glow 6s infinite ease-in-out;
    }
    .subtitle-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 18px;
      fill: #a0aec0;
      letter-spacing: 4px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" />

  <!-- Grid Overlay (subtle background details) -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Animated Search Tree Paths (Beam Width B=3) -->
  <g stroke-linecap="round">
    <!-- Root to Level 1 -->
    <line x1="150" y1="200" x2="350" y2="100" stroke="url(#accent-cyan)" stroke-width="3" class="flow-line" />
    <line x1="150" y1="200" x2="350" y2="200" stroke="url(#accent-cyan)" stroke-width="3" class="flow-line" />
    <line x1="150" y1="200" x2="350" y2="300" stroke="url(#accent-cyan)" stroke-width="3" class="flow-line" />

    <!-- Level 1 to Level 2 (Pruned and Expanded Paths) -->
    <!-- From 350,100 (kept) -->
    <line x1="350" y1="100" x2="550" y2="60" stroke="url(#accent-cyan)" stroke-width="2.5" class="flow-line" />
    <line x1="350" y1="100" x2="550" y2="130" stroke="url(#accent-cyan)" stroke-width="2.5" class="flow-line" />
    
    <!-- From 350,200 (kept) -->
    <line x1="350" y1="200" x2="550" y2="200" stroke="url(#accent-cyan)" stroke-width="2.5" class="flow-line" />
    
    <!-- From 350,300 (pruned branch - fades out) -->
    <line x1="350" y1="300" x2="520" y2="280" stroke="#ff4d4d" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.4" />
    <line x1="350" y1="300" x2="520" y2="340" stroke="#ff4d4d" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.4" />

    <!-- Level 2 to Level 3 -->
    <line x1="550" y1="60" x2="750" y2="50" stroke="url(#accent-purple)" stroke-width="2" class="flow-line" />
    <line x1="550" y1="130" x2="750" y2="150" stroke="url(#accent-purple)" stroke-width="2" class="flow-line" />
    <line x1="550" y1="200" x2="750" y2="250" stroke="url(#accent-purple)" stroke-width="2" class="flow-line" />
  </g>

  <!-- Nodes -->
  <!-- Root Node -->
  <circle cx="150" cy="200" r="14" fill="#ffffff" filter="url(#glow)" class="node-root" />
  
  <!-- Level 1 Nodes -->
  <circle cx="350" cy="100" r="8" fill="#00f2fe" class="node-pulse" />
  <circle cx="350" cy="200" r="8" fill="#00f2fe" class="node-pulse-delayed" />
  <circle cx="350" cy="300" r="8" fill="#ff4d4d" opacity="0.5" /> <!-- Pruned -->

  <!-- Level 2 Nodes -->
  <circle cx="550" cy="60" r="8" fill="#00f2fe" class="node-pulse-delayed" />
  <circle cx="550" cy="130" r="8" fill="#00f2fe" class="node-pulse" />
  <circle cx="550" cy="200" r="8" fill="#00f2fe" class="node-pulse-delayed" />
  <circle cx="520" cy="280" r="5" fill="#ff4d4d" opacity="0.3" /> <!-- Pruned -->
  <circle cx="520" cy="340" r="5" fill="#ff4d4d" opacity="0.3" /> <!-- Pruned -->

  <!-- Level 3 Nodes -->
  <circle cx="750" cy="50" r="8" fill="#b19ffb" class="node-pulse" />
  <circle cx="750" cy="150" r="8" fill="#b19ffb" class="node-pulse-delayed" />
  <circle cx="750" cy="250" r="8" fill="#b19ffb" class="node-pulse" />

  <!-- Text / Title -->
  <text x="800" y="200" class="title-text" text-anchor="start">AWESOME</text>
  <text x="800" y="250" class="title-text" text-anchor="start" fill="#4facfe">BEAM SEARCH</text>
  <text x="800" y="295" class="subtitle-text" text-anchor="start">ALGORITHMS &amp; SYSTEMS</text>

</svg>
